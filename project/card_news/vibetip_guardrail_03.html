<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080">
<title>guardrail · 03</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="card_news.css">
<style>
  html, body { width: 1080px; height: 1080px; margin: 0; padding: 0; overflow: hidden; }
  body { position: relative; background: var(--navy); }
</style>
</head>
<body>
  <section class="card card--navy">
    <header class="card-head">
      <div class="card-eyebrow">// 왜 금지선 먼저 · 03</div>

        <img src="../assets/signature_on_navy.png" alt="vibe.lab">

    </header>
    <div class="card-body card-body--top">
      <div class="card-num">03</div>

      <ul class="card-bullets" style="font-size: 42px; gap: 30px; margin-top: 8px;">

          <div><span class="lead-in">자율성이 높을수록.</span> <span class="rest">잘못된 자동 실행의 피해도 커진다</span></div>

        <li>
          <span class="caret">&gt;</span>
          <div><span class="lead-in">되돌리기 어려운 일.</span> <span class="rest">배포·삭제·전송은 사람이 확인</span></div>

        <li>
          <span class="caret">&gt;</span>
          <div><span class="lead-in">안전장치가 있으면.</span> <span class="rest">나머지는 믿고 맡길 수 있다</span></div>
