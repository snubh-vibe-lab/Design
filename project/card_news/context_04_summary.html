<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080">
<title>컨텍스트 관리 · 04 Summary</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="card_news.css">
<style>
  html, body { width: 1080px; height: 1080px; margin: 0; padding: 0; overflow: hidden; }
  body { position: relative; background: var(--navy); }
</style>
</head>
<body>
  <section class="card card--navy">
    <header class="card-head">
      <div class="card-eyebrow">// SUMMARY · 04</div>
      <div class="card-sig">
        <img src="../assets/signature_on_navy.png" alt="vibe.lab">
      </div>
    </header>
    <div class="card-body">
      <div class="card-num">04</div>
      <h2 class="card-title" style="color: var(--cream); font-size: 96px;">
        짧게, 자주,<br>명확하게<i class="cursor"></i>
      </h2>
      <hr class="card-rule">
      <p class="card-lead">
        컨텍스트는 소모됩니다.<br>
        적게 쓰고, 제때 리셋하세요.<br>
        <span style="font-family: var(--font-mono); font-size: 26px; letter-spacing: 0.08em; color: var(--mute-on-navy);">github.com/snubh-vibe-lab</span>
      </p>
    </div>
    <div class="card-avatar">
      <img src="../assets/vibe_lab_avatar.png" alt="VL">
    </div>
    <footer class="card-foot">
      <span>SNUBH VIBE LAB · 04 / 04</span>
      <span>END</span>
    </footer>
  </section>
<script>
window.addEventListener('load', () => {
  const avatar = document.querySelector('.card-avatar');
  const body = document.querySelector('.card-body');
  if (!avatar || !body) return;
  const gap = 24;
  const bodyRect = body.getBoundingClientRect();
  const avatarRect = avatar.getBoundingClientRect();
  if (avatarRect.top < bodyRect.bottom + gap) {
    const shift = bodyRect.bottom + gap - avatarRect.top;
    const curBottom = parseFloat(getComputedStyle(avatar).bottom) || 168;
    avatar.style.bottom = (curBottom + shift) + 'px';
    avatar.style.top = 'auto';
  }
});
</script>
</body>
</html>
