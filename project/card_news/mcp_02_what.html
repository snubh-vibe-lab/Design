<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080">
<title>MCP · 02 MCP란</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="card_news.css">
<style>
  html, body { width: 1080px; height: 1080px; margin: 0; padding: 0; overflow: hidden; }
  body { position: relative; background: var(--cream); }
</style>
</head>
<body>
  <section class="card card--cream">
    <header class="card-head">
      <div class="card-eyebrow">// MCP란 · 02</div>
      <div class="card-sig">
        <img src="../assets/signature_on_cream.png" alt="vibe.lab">
      </div>
    </header>
    <div class="card-body card-body--top">
      <div class="card-num">02</div>
      <h2 class="card-title" style="font-size: 80px;">Claude가<br>직접 움직인다<i class="cursor"></i></h2>
      <hr class="card-rule">
      <ul class="card-bullets" style="font-size: 42px; gap: 30px; margin-top: 8px;">
        <li>
          <span class="caret">&gt;</span>
          <div><span class="lead-in">기존 Claude.</span> <span class="rest">질문하면 답만 줌 — 실행은 내가 직접</span></div>
        </li>
        <li>
          <span class="caret">&gt;</span>
          <div><span class="lead-in">MCP 연결 후.</span> <span class="rest">Claude가 앱·DB·파일에 직접 접근해 실행</span></div>
        </li>
        <li>
          <span class="caret">&gt;</span>
          <div><span class="lead-in">한 문장으로.</span> <span class="rest">"Claude의 손발을 만들어주는 연결 규약"</span></div>
        </li>
      </ul>
    </div>
    <footer class="card-foot">
      <span><span class="page-num">02</span> &nbsp;·&nbsp; 04</span>
      <span class="swipe">SWIPE</span>
    </footer>
  </section>
