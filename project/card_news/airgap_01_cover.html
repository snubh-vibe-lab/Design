<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080">
<title>망분리 환경 코딩 · 01 Cover</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="card_news.css">
<style>
  html, body { width: 1080px; height: 1080px; margin: 0; padding: 0; overflow: hidden; }
  body { position: relative; background: var(--navy); }
</style>
</head>
<body>
  <section class="card card--navy">
    <header class="card-head">
      <div class="card-eyebrow">// 2026.05 · CARD NEWS</div>
      <div class="card-sig">
        <img src="../assets/signature_on_navy.png" alt="vibe.lab">
      </div>
    </header>
    <div class="card-body">
      <div class="card-num">01 · COVER</div>
      <h1 class="card-title card-title--cover" style="color: var(--cream);">
        망분리 환경 /<br>코딩 가이드<i class="cursor"></i>
      </h1>
      <hr class="card-rule">
      <p class="card-lead" style="font-size: 42px; line-height: 1.4;">
        인터넷이 없어도 Claude는 코드를 만든다.<br>
        어떤 코드가 망분리 환경에서 돌아갈까?
      </p>
    </div>
    <footer class="card-foot">
      <span>SNUBH VIBE LAB</span>
      <span class="swipe">SWIPE</span>
    </footer>
  </section>
</body>
</html>
