<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080">
<title>논문 인용 · 02 문제</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="card_news.css">
<style>
  html, body { width: 1080px; height: 1080px; margin: 0; padding: 0; overflow: hidden; }
  body { position: relative; background: var(--cream); }
</style>
</head>
<body>
  <section class="card card--cream">
    <header class="card-head">
      <div class="card-eyebrow">// 왜 위험한가 · 02</div>
      <div class="card-sig">
        <img src="../assets/signature_on_cream.png" alt="vibe.lab">
      </div>
    </header>
    <div class="card-body card-body--top">
      <div class="card-num">02</div>
      <h2 class="card-title" style="font-size: 80px;">AI는 논문을<br>지어낸다<i class="cursor"></i></h2>
      <hr class="card-rule">
      <ul class="card-bullets" style="font-size: 42px; gap: 30px; margin-top: 8px;">
        <li>
          <span class="caret">&gt;</span>
          <div><span class="lead-in">존재하지 않는 논문.</span> <span class="rest">제목·저자·DOI 모두 그럴듯하지만 실제로 없음</span></div>
        </li>
        <li>
          <span class="caret">&gt;</span>
          <div><span class="lead-in">형식은 완벽.</span> <span class="rest">저널명, 연도, 페이지까지 정확해 보임</span></div>
        </li>
        <li>
          <span class="caret">&gt;</span>
          <div><span class="lead-in">확인 전엔 모른다.</span> <span class="rest">세부 분야·최신 연구일수록 위험</span></div>
        </li>
      </ul>
    </div>
    <footer class="card-foot">
      <span><span class="page-num">02</span> &nbsp;·&nbsp; 04</span>
      <span class="swipe">SWIPE</span>
    </footer>
  </section>
</body>
</html>
