<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080">
<title>망분리 환경 코딩 · 02 기준</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="card_news.css">
<style>
  html, body { width: 1080px; height: 1080px; margin: 0; padding: 0; overflow: hidden; }
  body { position: relative; background: var(--cream); }
  .matrix {
    margin-top: 40px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }
  .matrix-cell {
    border: 1px solid var(--rule-on-cream);
    padding: 28px 32px;
    border-radius: 4px;
  }
  .matrix-cell .label {
    font-family: var(--font-mono);
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.12em;
    color: var(--mute-on-cream);
    margin-bottom: 12px;
  }
  .matrix-cell .value {
    font-family: var(--font-sans);
    font-size: 34px;
    font-weight: 600;
    color: var(--navy);
    line-height: 1.3;
  }
  .matrix-cell .desc {
    font-family: var(--font-sans);
    font-size: 26px;
    font-weight: 400;
    color: var(--body-dim);
    line-height: 1.4;
    margin-top: 10px;
  }
</style>
</head>
<body>
  <section class="card card--cream">
    <header class="card-head">
      <div class="card-eyebrow">// 기준 · 02</div>
      <div class="card-sig">
        <img src="../assets/signature_on_cream.png" alt="vibe.lab">
      </div>
    </header>
    <div class="card-body card-body--top">
      <div class="card-num">02</div>
      <h2 class="card-title" style="font-size: 80px;">두 가지 기준</h2>
      <hr class="card-rule">
      <p class="card-lead" style="font-size: 42px; line-height: 1.4;">
        이 두 질문이 가능한 코드의 범위를 결정합니다.
      </p>
      <div class="matrix">
        <div class="matrix-cell">
          <div class="label">QUESTION 01</div>
          <div class="value">설치 권한 있나요?</div>
          <div class="desc">PC에 프로그램을 새로 설치할 수 있는가</div>
        </div>
        <div class="matrix-cell">
          <div class="label">QUESTION 02</div>
          <div class="value">의존성을 반입할 수 있나요?</div>
          <div class="desc">pip · npm 패키지를 USB 등으로 가져올 수 있는가</div>
        </div>
      </div>
    </div>
    <footer class="card-foot">
      <span><span class="page-num">02</span> &nbsp;·&nbsp; 05</span>
      <span class="swipe">SWIPE</span>
    </footer>
  </section>
</body>
</html>
