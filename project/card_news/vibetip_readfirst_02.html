<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080">
<title>readfirst · 02</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="card_news.css">
<style>
  html, body { width: 1080px; height: 1080px; margin: 0; padding: 0; overflow: hidden; }
  body { position: relative; background: var(--cream); }
</style>
</head>
<body>
  <section class="card card--cream">
    <header class="card-head">
      <div class="card-eyebrow">// 왜 읽히나 · 02</div>
      <div class="card-sig">
        <img src="../assets/signature_on_cream.png" alt="vibe.lab">
      </div>
    </header>
    <div class="card-body card-body--top">
      <div class="card-num">02</div>
      <h2 class="card-title" style="font-size: 80px;">바로 고치면<br>위험하다</h2>
      <hr class="card-rule">
      <ul class="card-bullets" style="font-size: 42px; gap: 30px; margin-top: 8px;">
        <li>
          <span class="caret">&gt;</span>
          <div><span class="lead-in">바로 수정.</span> <span class="rest">“에러 고쳐줘” → 비슷한 파일을 잘못 건드린다</span></div>
        </li>
        <li>
          <span class="caret">&gt;</span>
          <div><span class="lead-in">먼저 조사.</span> <span class="rest">“관련 파일 찾아 구조만 요약” → 판단 근거가 생긴다</span></div>
        </li>
        <li>
          <span class="caret">&gt;</span>
          <div><span class="lead-in">한 턴에.</span> <span class="rest">조사와 수정을 섞지 않는다</span></div>
        </li>
      </ul>
    </div>
    <footer class="card-foot">
      <span><span class="page-num">02</span> &nbsp;·&nbsp; 04</span>
      <span class="swipe">SWIPE</span>
    </footer>
  </section>

</html>
