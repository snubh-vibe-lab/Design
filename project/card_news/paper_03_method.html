<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080">
<title>논문 인용 · 03 방법</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="card_news.css">
<style>
  html, body { width: 1080px; height: 1080px; margin: 0; padding: 0; overflow: hidden; }
  body { position: relative; background: var(--navy); }
</style>
</head>
<body>
  <section class="card card--navy">
    <header class="card-head">
      <div class="card-eyebrow">// 올바른 방법 · 03</div>
      <div class="card-sig">
        <img src="../assets/signature_on_navy.png" alt="vibe.lab">
      </div>
    </header>
    <div class="card-body card-body--top">
      <div class="card-num">03</div>
      <h2 class="card-title" style="font-size: 80px; color: var(--cream);">검색은 DB,<br>아이디어는 AI</h2>
      <hr class="card-rule">
      <ul class="card-bullets" style="font-size: 42px; gap: 30px; margin-top: 8px;">
        <li>
          <span class="caret">&gt;</span>
          <div><span class="lead-in">키워드 제안은 AI에게.</span> <span class="rest">"이 주제 논문 검색어 추천해줘"</span></div>
        </li>
        <li>
          <span class="caret">&gt;</span>
          <div><span class="lead-in">검색은 실제 DB에서.</span> <span class="rest">PubMed · Google Scholar · Semantic Scholar</span></div>
        </li>
        <li>
          <span class="caret">&gt;</span>
          <div><span class="lead-in">인용 전 원문 확인.</span> <span class="rest">DOI 클릭해 실제 논문 열어보기 필수</span></div>
        </li>
      </ul>
    </div>
    <footer class="card-foot">
      <span><span class="page-num">03</span> &nbsp;·&nbsp; 04</span>
      <span class="swipe">SWIPE</span>
    </footer>
  </section>
</body>
</html>
