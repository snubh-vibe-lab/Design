<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080">
<title>망분리 환경 코딩 · 04 설치 가능</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="card_news.css">
<style>
  html, body { width: 1080px; height: 1080px; margin: 0; padding: 0; overflow: hidden; }
  body { position: relative; background: var(--navy); }
  .tag {
    display: inline-block;
    font-family: var(--font-mono);
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.1em;
    background: var(--green);

    padding: 6px 16px;
    border-radius: 3px;
    margin-bottom: 20px;

<body>
  <section class="card card--navy">

      <hr class="card-rule">

    <footer class="card-foot">
      <span><span class="page-num">04</span> &nbsp;·&nbsp; 05</span>
