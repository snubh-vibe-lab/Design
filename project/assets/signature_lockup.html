<!DOCTYPE html>
<!--
  Official signature lockup variants.
  Source: uploads/Logo_baige.png (original, cream background)
  Recoloured on-navy version generated by run_script with palette mapping
  (cream → navy, dark ink → cream, green kept, mutes mapped to mute-on-navy).
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SNUBH Vibe Lab — Signature lockup</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    body { margin: 0; padding: 0; background: #ddd; font-family: var(--font-sans); }
    .grid { display: grid; gap: 24px; padding: 24px; max-width: 720px; }
    .panel { padding: 28px 36px; display: flex; align-items: center; justify-content: center; }
    .panel--cream { background: var(--cream); }
    .panel--navy  { background: var(--navy); }
    .panel img { width: 360px; height: auto; display: block; }
    .caption {
      font-family: var(--font-mono); font-size: 10pt; letter-spacing: 0.15em;
      color: var(--mute-on-cream); text-transform: uppercase; padding: 0 4px;
    }
  </style>
</head>
<body>
  <div class="grid">
    <div class="caption">// signature_on_cream.png · 2227×889 · use on cream slides</div>
    <div class="panel panel--cream">
      <img src="signature_on_cream.png" alt="vibe.lab signature">
    </div>
    <div class="caption">// signature_on_navy.png · use on navy slides</div>
    <div class="panel panel--navy">
      <img src="signature_on_navy.png" alt="vibe.lab signature">
    </div>
  </div>
</body>
</html>
