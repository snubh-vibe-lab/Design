<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font-sans);
    background: var(--cream);
    color: var(--navy);
    width: 700px;
    min-height: 150px;
    box-sizing: border-box;
    padding: 22px 26px;
    display: flex;
    align-items: center;
  }
  .card { width: 100%; }
  
</style>
</head><body><div class="card">

  <div style="font-family: var(--font-mono); font-size: 10pt; letter-spacing: 0.12em; color: var(--mute-on-cream); margin-bottom: 16px;">// MACOS WINDOW DOTS · content-slide header strip only</div>
  <div style="display:flex; gap:32px; align-items:center;">
    <div>
      <span class="vl-mac-dots"><i></i><i></i><i></i></span>
    </div>
    <div style="display:flex; gap:18px; font-family: var(--font-mono); font-size: 10pt; color: var(--navy);">
      <div><span style="display:inline-block; width:10px; height:10px; background:var(--mac-red); border-radius:50%; vertical-align:-1px; margin-right:6px;"></span>#FF5F57</div>
      <div><span style="display:inline-block; width:10px; height:10px; background:var(--mac-yellow); border-radius:50%; vertical-align:-1px; margin-right:6px;"></span>#FEBC2E</div>
      <div><span style="display:inline-block; width:10px; height:10px; background:var(--mac-green); border-radius:50%; vertical-align:-1px; margin-right:6px;"></span>#28C840</div>
    </div>
  </div>

</div></body></html>
