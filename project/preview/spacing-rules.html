<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font-sans);
    background: var(--cream);
    color: var(--navy);
    width: 700px;
    min-height: 150px;
    box-sizing: border-box;
    padding: 22px 26px;
    display: flex;
    align-items: center;
  }
  .card { width: 100%; }
  
</style>
</head><body><div class="card">

  <div style="font-family: var(--font-mono); font-size: 9pt; letter-spacing: 0.15em; color: var(--mute-on-cream); text-transform:uppercase; margin-bottom: 12px;">// RULES &amp; RADII · sharp by default</div>
  <div style="display:flex; gap: 28px; align-items:center;">
    <div>
      <hr style="border:0; border-top: 1px solid var(--rule-on-cream); width: 64px; margin: 0 0 6px 0;">
      <div style="font-family: var(--font-mono); font-size: 9pt; color: var(--mute-on-cream); letter-spacing: 0.08em;">1pt · 64px · under titles</div>
    </div>
    <div>
      <div style="width: 36px; height: 36px; background: var(--navy); border-radius: 0;"></div>
      <div style="font-family: var(--font-mono); font-size: 9pt; color: var(--mute-on-cream); letter-spacing: 0.08em; margin-top:4px;">radius 0 · cards</div>
    </div>
    <div>
      <div style="width: 36px; height: 36px; background: var(--navy); border-radius: 999px;"></div>
      <div style="font-family: var(--font-mono); font-size: 9pt; color: var(--mute-on-cream); letter-spacing: 0.08em; margin-top:4px;">radius 999 · dots only</div>
    </div>
    <div>
      <div style="width: 6px; height: 36px; background: var(--green);"></div>
      <div style="font-family: var(--font-mono); font-size: 9pt; color: var(--mute-on-cream); letter-spacing: 0.08em; margin-top:4px;">cursor block · 0.14"</div>
    </div>
  </div>

</div></body></html>
