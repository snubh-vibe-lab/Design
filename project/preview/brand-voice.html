<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font-sans);
    background: var(--cream);
    color: var(--navy);
    width: 700px;
    min-height: 150px;
    box-sizing: border-box;
    padding: 22px 26px;
    display: flex;
    align-items: center;
  }
  .card { width: 100%; }
  
</style>
</head><body><div class="card">

  <div style="font-family: var(--font-mono); font-size: 9pt; letter-spacing: 0.15em; color: var(--mute-on-cream); text-transform:uppercase; margin-bottom: 10px;">// VOICE · quiet, specific, unmistakably ours</div>
  <div style="font-family: var(--font-sans); font-size: 11.5pt; line-height: 1.55; color: var(--body-dim);">
    <span style="color: var(--navy); font-weight: 600;">Korean primary, polite (~합니다).</span>
    First-person plural (우리). Mid-career clinicians address each other as 동료 — never "user," never "customer."
    No emoji. <code style="font-family:var(--font-mono); font-size: 10pt; color: var(--green);">&gt;</code> opens bullets, <code style="font-family:var(--font-mono); font-size: 10pt; color: var(--mute-on-cream);">//</code> opens labels.
  </div>

</div></body></html>
