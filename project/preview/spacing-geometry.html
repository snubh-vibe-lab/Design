<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font-sans);
    background: var(--cream);
    color: var(--navy);
    width: 700px;
    min-height: 150px;
    box-sizing: border-box;
    padding: 22px 26px;
    display: flex;
    align-items: center;
  }
  .card { width: 100%; }
  
</style>
</head><body><div class="card">

  <div style="display:flex; gap: 22px; align-items:center;">
    <div style="position:relative; width: 240px; height: 135px; background: var(--cream); border: 1px solid var(--rule-on-cream); flex-shrink:0;">
      <div style="position:absolute; inset: 11px 22px 11px 22px; border: 1px dashed var(--rule-on-cream);"></div>
      <div style="position:absolute; left: 22px; top: 11px; right: 22px; bottom: 11px; display:flex; flex-direction:column; justify-content:space-between;">
        <div style="font-family:var(--font-mono); font-size: 7pt; color: var(--mute-on-cream); letter-spacing: 0.1em;">// 0.6"</div>
        <div style="font-family:var(--font-sans); font-weight:700; color: var(--navy); font-size: 9pt;">CONTENT</div>
        <div style="font-family:var(--font-mono); font-size: 6.5pt; color: var(--mute-on-cream); letter-spacing: 0.1em; text-align:right;">SNUBH VIBE LAB · 04</div>
      </div>
    </div>
    <div>
      <div style="font-family: var(--font-mono); font-size: 9pt; letter-spacing: 0.15em; color: var(--mute-on-cream); text-transform:uppercase; margin-bottom: 8px;">// SLIDE GEOMETRY</div>
      <div style="font-family: var(--font-mono); font-size: 11pt; color: var(--navy); line-height: 1.6;">
        13.333" × 7.5" · 16:9<br>
        <span style="color: var(--mute-on-cream);">margin-x</span> &nbsp;0.6"<br>
        <span style="color: var(--mute-on-cream);">margin-y</span> &nbsp;0.5"<br>
        <span style="color: var(--mute-on-cream);">content-x</span> 0.6" left-aligned
      </div>
    </div>
  </div>

</div></body></html>
