<!DOCTYPE html>
<!-- @dsCard group="Brand" -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font-sans);
    background: #ddd;
    color: var(--navy);
    width: 700px;
    box-sizing: border-box;
    padding: 22px 26px;
  }
  .meta {
    font-family: var(--font-mono); font-size: 9pt;
    letter-spacing: 0.15em; color: var(--mute-on-cream);
    text-transform: uppercase; margin-bottom: 12px;
  }
  .panel {
    padding: 22px 30px; min-height: 64px;
    display: flex; align-items: center; justify-content: center;
  }
  .panel--cream { background: var(--cream); border: 1px solid var(--rule-on-cream); }
  .panel--navy  { background: var(--navy); }
  .panel img { width: 320px; height: auto; display: block; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
</style>
</head>
<body>
  <div class="meta">// SIGNATURE LOCKUP · vibe.lab · SNUBH · ESTABLISHED CLINICIANS</div>
  <div class="row">
    <div class="panel panel--cream">
      <img src="../assets/signature_on_cream.png" alt="vibe.lab signature on cream">
    </div>
    <div class="panel panel--navy">
      <img src="../assets/signature_on_navy.png" alt="vibe.lab signature on navy">
    </div>
  </div>
</body>
</html>
