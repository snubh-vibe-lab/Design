<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font-sans);
    background: var(--cream);
    color: var(--navy);
    width: 700px;
    min-height: 150px;
    box-sizing: border-box;
    padding: 22px 26px;
    display: flex;
    align-items: center;
  }
  .card { width: 100%; }
  
</style>
</head><body><div class="card">

  <div style="display:flex; gap:14px; align-items:stretch;">
    <div style="flex:1.2; background: var(--navy); color: var(--cream); padding:18px 18px; min-height:130px; display:flex; flex-direction:column; justify-content:space-between;">
      <div style="font-family: var(--font-mono); font-size: 10pt; letter-spacing: 0.12em; color: var(--mute-on-navy);">// NAVY</div>
      <div>
        <div style="font-weight:700; font-size:18pt; letter-spacing:-0.01em;">#0E2340</div>
        <div style="font-family: var(--font-mono); font-size: 9pt; letter-spacing: 0.15em; color: var(--mute-on-navy); text-transform: uppercase; margin-top: 4px;">--navy · primary dark</div>
      </div>
    </div>
    <div style="flex:1.2; background: var(--cream); color: var(--navy); padding:18px 18px; min-height:130px; display:flex; flex-direction:column; justify-content:space-between; border:1px solid var(--rule-on-cream);">
      <div style="font-family: var(--font-mono); font-size: 10pt; letter-spacing: 0.12em; color: var(--mute-on-cream);">// CREAM</div>
      <div>
        <div style="font-weight:700; font-size:18pt; letter-spacing:-0.01em;">#F2EEE5</div>
        <div style="font-family: var(--font-mono); font-size: 9pt; letter-spacing: 0.15em; color: var(--mute-on-cream); text-transform: uppercase; margin-top: 4px;">--cream · primary light</div>
      </div>
    </div>
    <div style="flex:1; background: var(--green); color: #04361a; padding:18px 18px; min-height:130px; display:flex; flex-direction:column; justify-content:space-between;">
      <div style="font-family: var(--font-mono); font-size: 10pt; letter-spacing: 0.12em; color: #04361a; opacity:0.7;">// GREEN</div>
      <div>
        <div style="font-weight:700; font-size:18pt; letter-spacing:-0.01em;">#1FB85C</div>
        <div style="font-family: var(--font-mono); font-size: 9pt; letter-spacing: 0.15em; opacity:0.7; text-transform: uppercase; margin-top: 4px;">--green · accent</div>
      </div>
    </div>
  </div>

</div></body></html>
