<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font-sans);
    background: var(--cream);
    color: var(--navy);
    width: 700px;
    min-height: 150px;
    box-sizing: border-box;
    padding: 22px 26px;
    display: flex;
    align-items: center;
  }
  .card { width: 100%; }
  
</style>
</head><body><div class="card">

  <div style="font-family: var(--font-mono); font-size: 10pt; letter-spacing: 0.12em; color: var(--mute-on-cream); margin-bottom: 14px;">// ON CREAM</div>
  <div style="display:flex; gap:24px;">
    <div style="flex:1;">
      <div style="display:flex; align-items:center; gap:10px;">
        <span style="width:16px; height:16px; background: var(--mute-on-cream); display:inline-block;"></span>
        <span style="color: var(--navy); font-weight:600; font-size: 13pt;">#5B6B7F</span>
      </div>
      <div style="font-family: var(--font-mono); font-size: 8.5pt; letter-spacing: 0.12em; color: var(--mute-on-cream); margin-top:6px;">--mute-on-cream · subtitle</div>
    </div>
    <div style="flex:1;">
      <div style="display:flex; align-items:center; gap:10px;">
        <span style="width:16px; height:16px; background: var(--rule-on-cream); display:inline-block;"></span>
        <span style="color: var(--navy); font-weight:600; font-size: 13pt;">#9AA8B8</span>
      </div>
      <div style="font-family: var(--font-mono); font-size: 8.5pt; letter-spacing: 0.12em; color: var(--mute-on-cream); margin-top:6px;">--rule-on-cream · 1pt rules</div>
    </div>
    <div style="flex:1;">
      <div style="display:flex; align-items:center; gap:10px;">
        <span style="width:16px; height:16px; background: var(--body-dim); display:inline-block;"></span>
        <span style="color: var(--navy); font-weight:600; font-size: 13pt;">#3A4D6B</span>
      </div>
      <div style="font-family: var(--font-mono); font-size: 8.5pt; letter-spacing: 0.12em; color: var(--mute-on-cream); margin-top:6px;">--body-dim · body on cream</div>
    </div>
  </div>

</div></body></html>
