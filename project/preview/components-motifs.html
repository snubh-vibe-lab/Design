<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font-sans);
    background: var(--cream);
    color: var(--navy);
    width: 700px;
    min-height: 150px;
    box-sizing: border-box;
    padding: 22px 26px;
    display: flex;
    align-items: center;
  }
  .card { width: 100%; }
  
</style>
</head><body><div class="card">

  <div style="font-family: var(--font-mono); font-size: 9pt; letter-spacing: 0.15em; color: var(--mute-on-cream); text-transform:uppercase; margin-bottom: 14px;">// MOTIFS · the system's three marks</div>
  <div style="display:flex; gap: 32px; align-items:center;">
    <div style="text-align:center;">
      <div style="font-family: var(--font-mono); font-weight: 700; font-size: 38pt; color: var(--green); line-height:1;">&gt;</div>
      <div style="font-family: var(--font-mono); font-size: 9pt; color: var(--mute-on-cream); letter-spacing: 0.1em; margin-top: 6px;">caret · bullets</div>
    </div>
    <div style="text-align:center;">
      <div style="font-family: var(--font-mono); font-weight: 700; font-size: 38pt; color: var(--mute-on-cream); line-height:1;">//</div>
      <div style="font-family: var(--font-mono); font-size: 9pt; color: var(--mute-on-cream); letter-spacing: 0.1em; margin-top: 6px;">slashes · labels</div>
    </div>
    <div style="text-align:center;">
      <div style="display:inline-block; background: var(--green); width: 18px; height: 38px; animation: vl-blink 1.05s steps(1, end) infinite;"></div>
      <div style="font-family: var(--font-mono); font-size: 9pt; color: var(--mute-on-cream); letter-spacing: 0.1em; margin-top: 6px;">cursor · title end</div>
    </div>
    <div style="text-align:center;">
      <div style="display:inline-flex; gap: 6px;">
        <span style="width:12px; height:12px; background: var(--mac-red); border-radius:50%;"></span>
        <span style="width:12px; height:12px; background: var(--mac-yellow); border-radius:50%;"></span>
        <span style="width:12px; height:12px; background: var(--mac-green); border-radius:50%;"></span>
      </div>
      <div style="font-family: var(--font-mono); font-size: 9pt; color: var(--mute-on-cream); letter-spacing: 0.1em; margin-top: 14px;">mac dots · header</div>
    </div>
  </div>

</div></body></html>
