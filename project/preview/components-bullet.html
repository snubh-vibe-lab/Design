<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font-sans);
    background: var(--cream);
    color: var(--navy);
    width: 700px;
    min-height: 150px;
    box-sizing: border-box;
    padding: 22px 26px;
    display: flex;
    align-items: center;
  }
  .card { width: 100%; }
  
</style>
</head><body><div class="card">

  <div>
    <div style="font-family: var(--font-mono); font-size: 9pt; letter-spacing: 0.15em; color: var(--mute-on-cream); text-transform:uppercase; margin-bottom: 10px;">// BULLET · &gt; caret + bold lead-in + dim rest</div>
    <div style="display:flex; align-items:baseline; gap: 10px; margin-bottom: 8px;">
      <span style="font-family: var(--font-mono); font-weight:700; font-size: 14pt; color: var(--green); width: 16px;">&gt;</span>
      <div style="font-family: var(--font-sans); font-size: 13pt; line-height: 1.4;">
        <strong style="font-weight:600; color: var(--navy);">타겟 행사.</strong>&nbsp;&nbsp;&nbsp;<span style="color: var(--body-dim);">매월 네 번째 주 수요일 저녁</span>
      </div>
    </div>
    <div style="display:flex; align-items:baseline; gap: 10px;">
      <span style="font-family: var(--font-mono); font-weight:700; font-size: 14pt; color: var(--green); width: 16px;">&gt;</span>
      <div style="font-family: var(--font-sans); font-size: 13pt; line-height: 1.4;">
        <strong style="font-weight:600; color: var(--navy);">출석 정책.</strong>&nbsp;&nbsp;&nbsp;<span style="color: var(--body-dim);">완벽한 출석보다 꾸준한 참여</span>
      </div>
    </div>
  </div>

</div></body></html>
