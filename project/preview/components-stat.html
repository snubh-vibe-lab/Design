<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font-sans);
    background: var(--cream);
    color: var(--navy);
    width: 700px;
    min-height: 150px;
    box-sizing: border-box;
    padding: 22px 26px;
    display: flex;
    align-items: center;

      73<span style="color: var(--green);">%</span>
    </div>
    <div style="flex: 1;">
      <div style="font-family: var(--font-mono); font-weight: 700; font-size: 10pt; letter-spacing: 0.12em; color: var(--mute-on-cream); text-transform:uppercase; margin-bottom: 6px;">// IMPACT</div>
      <div style="font-family: var(--font-sans); font-size: 12pt; line-height: 1.4; color: var(--body-dim);">

      </div>
    </div>
  </div>

</div></body></html>
