<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font-sans);
    background: var(--cream);
    color: var(--navy);
    width: 700px;
    min-height: 150px;
    box-sizing: border-box;
    padding: 22px 26px;
    display: flex;
    align-items: center;
  }
  .card { width: 100%; }
  
</style>
</head><body><div class="card">

  <div style="font-family: var(--font-mono); font-size: 9pt; letter-spacing: 0.15em; color: var(--mute-on-cream); text-transform:uppercase; margin-bottom: 10px;">// TYPE SCALE · point-based, 16:9 deck baseline</div>
  <table style="font-family: var(--font-mono); font-size: 10.5pt; color: var(--navy); border-collapse: collapse; width:100%;">
    <tr><td style="padding:3px 12px 3px 0; color: var(--mute-on-cream);">H1 cover</td><td style="font-weight:600;">64pt / Bold / −1%</td><td style="color: var(--body-dim);">Inter</td></tr>
    <tr><td style="padding:3px 12px 3px 0; color: var(--mute-on-cream);">H2 slide</td><td style="font-weight:600;">42pt / Bold / −0.5%</td><td style="color: var(--body-dim);">Inter</td></tr>
    <tr><td style="padding:3px 12px 3px 0; color: var(--mute-on-cream);">Lead</td><td style="font-weight:600;">17pt / Regular</td><td style="color: var(--body-dim);">Inter</td></tr>
    <tr><td style="padding:3px 12px 3px 0; color: var(--mute-on-cream);">Body</td><td style="font-weight:600;">16pt / Regular</td><td style="color: var(--body-dim);">Inter</td></tr>
    <tr><td style="padding:3px 12px 3px 0; color: var(--mute-on-cream);">Mono label</td><td style="font-weight:600;">11pt / Bold / +12%</td><td style="color: var(--body-dim);">JBM</td></tr>
    <tr><td style="padding:3px 12px 3px 0; color: var(--mute-on-cream);">Footer</td><td style="font-weight:600;">9.5pt / Reg / +20%</td><td style="color: var(--body-dim);">JBM</td></tr>
  </table>

</div></body></html>
