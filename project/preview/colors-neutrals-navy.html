<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font-sans);
    background: #ddd;
    color: var(--navy);
    width: 700px;
    min-height: 150px;
    box-sizing: border-box;
    padding: 22px 26px;
    display: flex;
    align-items: center;
  }
  .card { width: 100%; }
  
</style>
</head><body><div class="card">

  <div style="background: var(--navy); padding: 24px 28px; min-height: 110px;">
    <div style="font-family: var(--font-mono); font-size: 10pt; letter-spacing: 0.12em; color: var(--mute-on-navy); margin-bottom: 16px;">// ON NAVY</div>
    <div style="display:flex; gap:24px;">
      <div style="flex:1;">
        <div style="display:flex; align-items:center; gap:10px;">
          <span style="width:16px; height:16px; background: var(--mute-on-navy); display:inline-block;"></span>
          <span style="color: var(--cream); font-weight:600; font-size: 13pt;">#8FA3C2</span>
        </div>
        <div style="font-family: var(--font-mono); font-size: 8.5pt; letter-spacing: 0.12em; color: var(--mute-on-navy); margin-top:6px;">--mute-on-navy · labels &amp; caption</div>
      </div>
      <div style="flex:1;">
        <div style="display:flex; align-items:center; gap:10px;">
          <span style="width:16px; height:16px; background: var(--rule-on-navy); display:inline-block;"></span>
          <span style="color: var(--cream); font-weight:600; font-size: 13pt;">#3A4D6B</span>
        </div>
        <div style="font-family: var(--font-mono); font-size: 8.5pt; letter-spacing: 0.12em; color: var(--mute-on-navy); margin-top:6px;">--rule-on-navy · 1pt rules</div>
      </div>
    </div>
  </div>

</div></body></html>
