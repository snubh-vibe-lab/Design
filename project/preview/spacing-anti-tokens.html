<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font-sans);
    background: var(--cream);
    color: var(--navy);
    width: 700px;
    min-height: 150px;
    box-sizing: border-box;
    padding: 22px 26px;
    display: flex;
    align-items: center;
  }
  .card { width: 100%; }
  
</style>
</head><body><div class="card">

  <div style="font-family: var(--font-mono); font-size: 9pt; letter-spacing: 0.15em; color: var(--mute-on-cream); text-transform:uppercase; margin-bottom: 12px;">// EFFECTS · what we don't use</div>
  <div style="display:flex; gap: 14px; font-family: var(--font-mono); font-size: 10pt;">
    <span style="padding: 6px 12px; background: var(--cream); color: var(--mute-on-cream); border:1px solid var(--rule-on-cream); text-transform:uppercase; letter-spacing:0.08em;">× SHADOW</span>
    <span style="padding: 6px 12px; background: var(--cream); color: var(--mute-on-cream); border:1px solid var(--rule-on-cream); text-transform:uppercase; letter-spacing:0.08em;">× GRADIENT</span>
    <span style="padding: 6px 12px; background: var(--cream); color: var(--mute-on-cream); border:1px solid var(--rule-on-cream); text-transform:uppercase; letter-spacing:0.08em;">× ROUNDED CARDS</span>
    <span style="padding: 6px 12px; background: var(--cream); color: var(--mute-on-cream); border:1px solid var(--rule-on-cream); text-transform:uppercase; letter-spacing:0.08em;">× EMOJI</span>
    <span style="padding: 6px 12px; background: var(--cream); color: var(--mute-on-cream); border:1px solid var(--rule-on-cream); text-transform:uppercase; letter-spacing:0.08em;">× BLUR</span>
  </div>

</div></body></html>
